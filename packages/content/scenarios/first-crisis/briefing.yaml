# Shown before the first game starts, and again from "How to play".

title: You lead Aldoria
focusCountry: corvan
sections:
  - heading: Your country
    text: >-
      Aldoria is an industrial nation. Its factories and drivers run on fuel,
      most of it refined abroad from crude that comes by sea; its people eat
      imported grain, its builders depend on steel from Thessa, and
      its industry and army on microchips from the island of Ilmar. When those
      prices rise, people feel it, and so does your government. Your budget
      feels it too: imports are paid for every month.

  - heading: How you win or lose
    text: >-
      Stay in power for five years. If stability stays below 20 for 30 days,
      you are ousted. Stability falls when the factions at home are unhappy,
      and they are unhappy when what they buy gets dearer.

  - heading: Your weak spot
    text: >-
      Your crude, and the crude for Thessa's refinery that makes much of your
      fuel, sails through the South Strait, and Corvan controls it. Tankers take
      a week or more, and you hold about three weeks of fuel, so trouble there
      reaches your pumps late and lingers.
      Relations with Corvan are already cool. If they sour far enough, Corvan
      can close the strait, and everything that follows starts there. Thessa
      holds a second gate, the Narrows, that your chips pass through. Kesh
      sells crude that comes overland, avoiding the strait, but its government is shaky, and
      distant Velmont would like to be your friend.

  - heading: How to act
    text: >-
      Time runs on its own; pause whenever you like. Click a country on the
      map to see what you can do about it, or open the Cabinet for every
      order, filed by ministry. Orders cost money or influence, some take weeks, and some can
      fail. Your advisor will speak up when something needs your attention.
