# Advisor tips. Each appears once per game, the first time its condition holds,
# and only if at least one suggested order can be signed right now (tips with
# no suggestions always qualify). Earlier tips in this file win ties.
# Conditions use the same vocabulary as events, except chance.

- id: corvan_slipping
  when:
    relation: { between: [aldoria, corvan], below: -12 }
  country: corvan
  text: >-
    Relations with Corvan are slipping. Your oil sails through their strait.
    An envoy now costs far less than a closed strait later.
  suggest: [envoy>corvan, transit_fees]

- id: corvan_on_the_edge
  when:
    all:
      - chokepointOpen: south_strait
      - relation: { between: [aldoria, corvan], below: -32 }
  country: corvan
  text: >-
    Corvan is close to closing the South Strait. Below -40 it could happen any
    day. Buy goodwill quickly: transit fees work at once.
  suggest: [transit_fees, envoy>corvan]

- id: orrin_friendly
  when:
    relation: { between: [aldoria, orrin], above: 34 }
  country: orrin
  text: >-
    Orrin is a real friend. A trade deal would bring more of its grain and
    ease prices, and once relations pass 50 a friendship treaty becomes
    possible. Friends are worth having before the strait gets rough.
  suggest: [trade_deal>orrin]

- id: kesh_courting
  when:
    relation: { between: [aldoria, kesh], above: 19 }
  country: kesh
  text: >-
    Kesh wants your business. Its oil comes overland, so it keeps flowing when
    the strait closes. A trade deal would be a hedge, though Kesh's government
    is shaky and a coup would void it.
  suggest: [trade_deal>kesh]

- id: narrows_closed
  when:
    chokepointClosed: narrows
  country: thessa
  text: >-
    The Narrows are closed, and no chips reach you. Industry and the army feel
    it within weeks. If Thessa closed them, an envoy may help; a storm will
    pass on its own.
  suggest: [envoy>thessa]

- id: strait_closed
  when:
    chokepointClosed: south_strait
  text: >-
    The strait is closed, and oil will climb for weeks. Release the reserves
    to soften the blow. For the long run, a pipeline from Veskar would avoid
    the strait altogether.
  suggest: [release_reserves, overland_pipeline]

- id: oil_hurting
  when:
    stat: { target: resource.oil.price, above: 8760 }
  text: >-
    Crude is 20% above normal, and workers and industry feel it at once.
    A fuel subsidy shields them for three months; Veskar might also agree to
    a discount.
  suggest: [fuel_subsidy, veskar_discount]

- id: oil_doubled
  when:
    stat: { target: resource.oil.price, above: 14600 }
  text: >-
    Crude has doubled. Rationing fuel cuts what Aldoria buys by a fifth, which
    shrinks your import bill and eases the price for everyone. Industry will
    grumble while it lasts.
  suggest: [ration_fuel]

- id: stability_sliding
  when:
    stat: { target: country.aldoria.stability, below: 40 }
  text: >-
    Stability is sliding. Open the Home tab to see which faction is unhappy
    and why, then deal with the cause. Addressing the nation buys a little
    time.
  suggest: [address_nation, fuel_subsidy]

- id: ousting_close
  when:
    stat: { target: country.aldoria.stability, below: 24 }
  text: >-
    You are close to the edge. Below 20 for 30 days and you are out. Spend
    what you must now; money left in the treasury will not save you.
  suggest: [address_nation, fuel_subsidy, release_reserves]

- id: thessa_angry
  when:
    relation: { between: [aldoria, thessa], below: -24 }
  country: thessa
  text: >-
    Thessa is angry, and Thessa is courting Corvan. Lifting any tariffs on
    Thessa would win back some goodwill. An intelligence file shows what
    Thessa is weighing, sooner, and makes it warier of moves in secret.
  suggest: [lift_tariff>thessa, intel_file>thessa]

- id: treasury_low
  when:
    stat: { target: country.aldoria.treasury, below: 80 }
  text: >-
    The treasury is running low, and dear imports drain it every month. Spend
    on what fixes causes rather than symptoms. A tariff raises money from what
    you already buy: on Veskar's oil it pays most, on Thessa's steel about
    1.6 bn a month. Either way, expect them to answer. Austerity saves about
    3 bn a month, if the workers will stand for it.
  suggest: [tariff>thessa, tariff>veskar, austerity]

- id: sanctioned_by_thessa
  when:
    flag: sanctioned_by_thessa
  country: thessa
  text: >-
    Thessa has cut all trade, and steel will soar while its sanctions stand.
    Thessa will lift them once relations mend, and an envoy or lifting any
    tariffs on Thessa helps. Failing that, its own exporters will force them
    open within months, but your industry may not last that long.
  suggest: [envoy>thessa, lift_tariff>thessa]
