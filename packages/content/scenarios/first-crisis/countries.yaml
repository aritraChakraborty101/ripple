# Stats are integers. treasury is in billions; the rest are 0 to 100 scores.
# demand is units imported per day.
#
# revenue and spending are the monthly budget before trade, in millions:
# taxes and upkeep. The economy system adds trade on top (imports, exports,
# transit tolls, tariffs) and settles the month into the treasury. Spending
# is set so each country runs a small surplus while prices are normal:
# Aldoria about 0.5 bn a month, so a careful player still has to choose what
# to spend on. Kesh alone runs a small deficit, which keeps it hungry.

- id: aldoria
  name: Aldoria
  archetype: industrial_importer
  stats:
    { stability: 61, treasury: 412, influence: 38, military: 40, revenue: 30000, spending: 10974 }
  demand: { oil: 40, grain: 20, steel: 25, chips: 10 }

- id: veskar
  name: Veskar
  archetype: resource_exporter
  stats:
    { stability: 60, treasury: 520, influence: 30, military: 50, revenue: 4000, spending: 18829 }
  demand: { grain: 10, steel: 5 }

