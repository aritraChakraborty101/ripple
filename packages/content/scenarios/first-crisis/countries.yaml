# Stats are integers. treasury is in billions; the rest are 0 to 100 scores.
# demand is units imported per day.
#
# revenue and spending are the monthly budget before trade, in millions:
# taxes and upkeep. The economy system adds trade on top (imports, exports,
# transit tolls) and settles the month into the treasury. Each country runs a
# small surplus while prices are normal; Aldoria's is about 0.5 bn a month,
# so a careful player still has to choose what to spend on.

- id: aldoria
  name: Aldoria
  archetype: industrial_importer
  stats:
    { stability: 61, treasury: 412, influence: 38, military: 40, revenue: 30000, spending: 15250 }
  demand: { oil: 40, grain: 20, steel: 25 }

