# Things that happen in the world. Each is checked every day; `chance` is in
# basis points per day (100 = 1%). Events without a trigger fire only when
# another event or decision schedules them.
#
# The main chain: tension with Corvan builds; past -40, Corvan may close the
# South Strait. Thessa can push Corvan further if Aldoria angers Thessa.

# --- Corvan and the strait ---------------------------------------------------

# A mild early warning, so new players meet the Corvan problem while there is
# still time to learn the screen and act calmly.
- id: corvan_customs_checks
  tag: corvan
  severity: warning
  headline: Corvan tightens customs checks on Aldorian ships
  detail: A small slight, but relations with Corvan cool for a few months.
  once: true
  trigger:
    all:
      - afterDay: 12
      - chance: 2500
  effects:
    - relation: { between: [aldoria, corvan], by: -5, days: 90 }

- id: fishing_dispute
  tag: corvan
  severity: warning
  headline: Corvan protests Aldorian fishing boats near the strait
  detail: Relations with Corvan cool sharply for several months.
  cooldownDays: 200
  trigger:
    all:
      - afterDay: 45
      - chance: 40
  effects:
    - relation: { between: [aldoria, corvan], by: -20, days: 120 }

- id: tanker_detained
  tag: corvan
  severity: warning
  headline: Corvan detains an Aldorian tanker in the strait
  detail: Customs officials cite paperwork. Few believe them.
  cooldownDays: 150
  trigger:
    all:
      - afterDay: 60
      - relation: { between: [aldoria, corvan], below: 0 }
      - chance: 30
  effects:
    - relation: { between: [aldoria, corvan], by: -15, days: 90 }

- id: corvan_nationalists
  tag: corvan
  severity: warning
  headline: Nationalist rallies in Corvan target Aldoria
  detail: Corvan's government hardens its tone toward Aldoria.
  cooldownDays: 90
  trigger:
    all:
      - relation: { between: [aldoria, corvan], below: -20 }
      - chance: 100
  effects:
    - relation: { between: [aldoria, corvan], by: -15, days: 90 }

- id: corvan_closes_strait
  tag: corvan
  severity: critical
  headline: Corvan closes the South Strait to shipping
  detail: Routes through the strait carry nothing until it reopens.
  cooldownDays: 120
  trigger:
    all:
      - chokepointOpen: south_strait
      - relation: { between: [aldoria, corvan], below: -40 }
      - chance: 400
  effects:
    - setChokepoint: { id: south_strait, open: false }
    - schedule: { event: corvan_reopens_strait, inDays: 75 }

- id: corvan_reopens_strait
  tag: corvan
  severity: info
  headline: Corvan reopens the South Strait
  detail: Shipping resumes, and Corvan signals it wants calmer relations.
  effects:
    - setChokepoint: { id: south_strait, open: true }
    - relation: { between: [aldoria, corvan], by: 15, days: 120 }

# --- Thessa ------------------------------------------------------------------

- id: thessa_courts_corvan
  tag: thessa
  severity: warning
  headline: Thessa courts Corvan with a security pact
  detail: Corvan drifts toward Thessa and away from Aldoria.
  cooldownDays: 150
  trigger:
    all:
      - relation: { between: [aldoria, thessa], below: -25 }
      - chance: 150
  effects:
    - relation: { between: [aldoria, corvan], by: -15, days: 150 }
    - relation: { between: [corvan, thessa], by: 10, days: 150 }

- id: thessa_corvan_summit
  tag: thessa
  severity: info
  headline: Thessa and Corvan hold a friendship summit
  detail: Closer ties between them leave Aldoria a little more isolated.
  cooldownDays: 240
  trigger:
    all:
      - afterDay: 90
      - chance: 20
  effects:
    - relation: { between: [aldoria, corvan], by: -10, days: 120 }
    - relation: { between: [corvan, thessa], by: 10, days: 240 }

- id: thessa_border_troops
  tag: thessa
  severity: critical
  headline: Thessan troops gather near the Corvan border
  detail: The show of force unsettles Aldoria and emboldens Corvan.
  cooldownDays: 180
  trigger:
    all:
      - relation: { between: [aldoria, thessa], below: -40 }
      - chance: 100
  effects:
    - relation: { between: [aldoria, corvan], by: -10, days: 90 }
    - modify: { target: country.aldoria.stability, add: -3, days: 60 }

- id: thessa_steel_retaliation
  tag: thessa
  severity: warning
  headline: Thessa curbs steel exports in retaliation
  detail: Steel gets dearer for three months.
  cooldownDays: 360
  trigger:
    all:
      - flag: steel_tariff_active
      - chance: 300
  effects:
    - relation: { between: [aldoria, thessa], by: -10, days: 180 }
    - modify: { target: resource.steel.price, pct: 1500, days: 90 }

# --- Markets -----------------------------------------------------------------

- id: veskar_price_hike
  tag: veskar
  severity: warning
  headline: Veskar raises its crude export price
  detail: With buyers desperate, Veskar adds 10% for six weeks.
  cooldownDays: 120
  trigger:
    all:
      - stat: { target: resource.oil.price, above: 10950 }
      - chance: 300
  effects:
    - modify: { target: resource.oil.price, pct: 1000, days: 45 }

- id: veskar_terminal_explosion
  tag: veskar
  severity: critical
  headline: Explosion shuts a major Veskari oil terminal
  detail: Veskar's seaborne exports are halved for about six weeks.
  cooldownDays: 300
  trigger:
    all:
      - afterDay: 120
      - chance: 12
  effects:
    - modify: { target: link.oil_veskar_aldoria.capacity, pct: -5000, days: 40 }
    - modify: { target: link.oil_veskar_thessa.capacity, pct: -5000, days: 40 }

- id: orrin_drought
  tag: orrin
  severity: warning
  headline: Drought withers Orrin's harvest
  detail: Grain shipments to Aldoria are halved for three months.
  cooldownDays: 360
  trigger:
    all:
      - afterDay: 180
      - chance: 8
  effects:
    - modify: { target: link.grain_orrin_aldoria.capacity, pct: -5000, days: 90 }

- id: orrin_bumper_harvest
  tag: orrin
  severity: info
  headline: Bumper harvest in Orrin
  detail: Grain is 15% cheaper for two months.
  cooldownDays: 300
  trigger:
    chance: 20
  effects:
    - modify: { target: resource.grain.price, pct: -1500, days: 60 }

# --- Home --------------------------------------------------------------------

- id: workers_strike_threat
  tag: home
  severity: warning
  headline: Unions threaten a general strike over living costs
  detail: Stability falls while the threat hangs over the country.
  cooldownDays: 60
  trigger:
    all:
      - stat: { target: faction.aldoria_workers.satisfaction, below: 42 }
      - chance: 400
  effects:
    - modify: { target: country.aldoria.stability, add: -5, days: 45 }

- id: industry_layoffs
  tag: home
  severity: warning
  headline: Factories cut shifts as costs bite
  detail: Workers lose income and the treasury loses tax revenue.
  cooldownDays: 90
  trigger:
    all:
      - stat: { target: faction.aldoria_industry.satisfaction, below: 40 }
      - chance: 300
  effects:
    - modify: { target: faction.aldoria_workers.satisfaction, add: -6, days: 60 }
    - adjust: { target: country.aldoria.treasury, by: -15 }

- id: military_doubts
  tag: home
  severity: warning
  headline: Senior officers voice doubts about the government
  detail: The military's loyalty wavers.
  cooldownDays: 120
  trigger:
    all:
      - stat: { target: country.aldoria.stability, below: 35 }
      - chance: 200
  effects:
    - modify: { target: faction.aldoria_military.satisfaction, add: -8, days: 90 }
