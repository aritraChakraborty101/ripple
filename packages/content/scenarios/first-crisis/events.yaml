# Things that happen in the world: accidents, incidents and moods. Each is
# checked every day; `chance` is in basis points per day (100 = 1%). Events
# without a trigger fire only when another event or order schedules them.
#
# Deliberate choices by other countries (closing the strait, massing troops,
# raising prices) are not events: the countries choose them, in actions.yaml.

# --- Corvan and the strait ---------------------------------------------------

# A mild early warning, so new players meet the Corvan problem while there is
# still time to learn the screen and act calmly.
- id: corvan_customs_checks
  tag: corvan
  severity: warning
  headline: Corvan tightens customs checks on Aldorian ships
  detail: A small slight, but relations with Corvan cool for a few months.
  once: true
  trigger:
    all:
      - afterDay: 12
      - chance: 2500
  effects:
    - relation: { between: [aldoria, corvan], by: -5, days: 90 }

- id: fishing_dispute
  tag: corvan
  severity: warning
  headline: Corvan protests Aldorian fishing boats near the strait
  detail: Relations with Corvan cool sharply for several months.
  cooldownDays: 200
  trigger:
    all:
      - afterDay: 45
      - chance: 40
  effects:
    - relation: { between: [aldoria, corvan], by: -20, days: 120 }

- id: corvan_nationalists
  tag: corvan
  severity: warning
  headline: Nationalist rallies in Corvan target Aldoria
  detail: Corvan's government hardens its tone toward Aldoria.
  cooldownDays: 90
  trigger:
    all:
      - relation: { between: [aldoria, corvan], below: -20 }
      - chance: 100
  effects:
    - relation: { between: [aldoria, corvan], by: -15, days: 90 }

- id: corvan_reopens_strait
  tag: corvan
  severity: info
  headline: Under international pressure, Corvan reopens the South Strait
  detail: Shipping resumes. Corvan's closure (see actions.yaml) schedules this as a backstop.
  # Only if Corvan has not already reopened it by choice.
  requires: { chokepointClosed: south_strait }
  effects:
    - setChokepoint: { id: south_strait, open: true }
    - relation: { between: [aldoria, corvan], by: 15, days: 120 }

# --- Thessa ------------------------------------------------------------------

# Scheduled by Thessa's sanctions (see actions.yaml): a backstop, if Thessa has
# not lifted them by choice within eight months.
- id: thessa_sanctions_collapse
  tag: thessa
  severity: info
  headline: Thessa's sanctions on Aldoria collapse under pressure from its own exporters
  detail: Steel flows to Aldoria again.
  requires: { flag: sanctioned_by_thessa }
  effects:
    - embargo: { by: thessa, against: aldoria, active: false }
    - clearFlag: sanctioned_by_thessa
    - relation: { between: [aldoria, thessa], by: 5, days: 120 }

# --- The Narrows, Ilmar and Kesh ----------------------------------------------

# Scheduled by Thessa's closure (see actions.yaml): the backstop, if Thessa has
# not reopened by choice.
- id: narrows_reopen
  tag: thessa
  severity: info
  headline: Under pressure from Velmont, Thessa reopens the Narrows
  detail: Chips flow again.
  requires: { flag: narrows_closed_by_thessa }
  effects:
    - setChokepoint: { id: narrows, open: true }
    - clearFlag: narrows_closed_by_thessa
    - relation: { between: [aldoria, thessa], by: 5, days: 120 }

- id: narrows_typhoon
  tag: world
  severity: warning
  headline: A typhoon closes the Narrows
  detail: Chip shipments stop for about ten days.
  cooldownDays: 300
  trigger:
    all:
      - chokepointOpen: narrows
      - afterDay: 90
      - chance: 15
  effects:
    - setChokepoint: { id: narrows, open: false }
    - schedule: { event: narrows_typhoon_passes, inDays: 10 }

- id: narrows_typhoon_passes
  tag: world
  severity: info
  headline: The typhoon passes and the Narrows reopen
  # Not if Thessa has closed them in the meantime.
  requires:
    all:
      - chokepointClosed: narrows
      - noFlag: narrows_closed_by_thessa
  effects:
    - setChokepoint: { id: narrows, open: true }

- id: ilmar_fab_fire
  tag: ilmar
  severity: critical
  headline: Fire shuts Ilmar's largest chip plant
  detail: Ilmar's chip exports are halved for about two months.
  cooldownDays: 360
  trigger:
    all:
      - afterDay: 150
      - chance: 8
  effects:
    - modify: { target: link.chips_ilmar_aldoria.capacity, pct: -5000, days: 60 }
    - modify: { target: link.chips_ilmar_thessa.capacity, pct: -5000, days: 60 }
    - modify: { target: link.chips_ilmar_velmont.capacity, pct: -5000, days: 60 }
    - modify: { target: link.chips_ilmar_kesh.capacity, pct: -5000, days: 60 }
    - modify: { target: link.deal_ilmar.capacity, pct: -5000, days: 60 }

# Kesh's government is shaky: protests come and go, and if its stability falls
# far enough the army takes over. The coup stops Kesh's oil for months and
# ends any deal with Aldoria. Aid from abroad (Aldoria's or Velmont's) props
# it up.
- id: kesh_protests
  tag: kesh
  severity: info
  headline: Protests over prices spread in Kesh
  detail: Kesh's government wobbles.
  cooldownDays: 150
  trigger:
    all:
      - afterDay: 60
      - stat: { target: country.kesh.stability, below: 45 }
      - chance: 80
  effects:
    - modify: { target: country.kesh.stability, add: -10, days: 120 }

- id: kesh_coup
  tag: kesh
  severity: critical
  headline: The army seizes power in Kesh
  detail: Kesh's oil stops for about four months, and its deals are void.
  cooldownDays: 540
  trigger:
    all:
      - stat: { target: country.kesh.stability, below: 30 }
      - chance: 80
  effects:
    - modify: { target: link.oil_kesh_velmont.capacity, pct: -10000, days: 120 }
    - modify: { target: link.oil_kesh_thessa.capacity, pct: -10000, days: 120 }
    - modify: { target: link.oil_kesh_ilmar.capacity, pct: -10000, days: 120 }
    - modify: { target: link.deal_kesh.capacity, pct: -10000, days: 120 }
    - endEffectsOf: { decision: trade_deal, target: kesh }
    - clearFlag: deal_with_kesh
    - adjust: { target: country.kesh.stability, by: 12 }
    - relation: { between: [aldoria, kesh], by: -10, days: 180 }

# --- Money ---------------------------------------------------------------------

- id: budget_crisis
  tag: home
  severity: warning
  headline: Lenders balk as Aldoria's debts mount
  detail: The government looks weak while the debt lasts.
  cooldownDays: 180
  trigger:
    all:
      - stat: { target: country.aldoria.treasury, below: -20 }
      - chance: 300
  effects:
    - modify: { target: country.aldoria.stability, add: -4, days: 60 }
    - modify: { target: faction.aldoria_industry.satisfaction, add: -4, days: 60 }

# --- Markets -----------------------------------------------------------------

- id: veskar_terminal_explosion
  tag: veskar
  severity: critical
  headline: Explosion shuts a major Veskari oil terminal
  detail: Veskar's seaborne exports are halved for about six weeks.
  cooldownDays: 300
  trigger:
    all:
      - afterDay: 120
      - chance: 18
  effects:
    - modify: { target: link.oil_veskar_aldoria.capacity, pct: -5000, days: 40 }
    - modify: { target: link.oil_veskar_thessa.capacity, pct: -5000, days: 40 }
    - modify: { target: link.oil_veskar_velmont.capacity, pct: -5000, days: 40 }

- id: orrin_drought
  tag: orrin
  severity: warning
  headline: Drought withers Orrin's harvest
  detail: Grain shipments to Aldoria are halved for three months.
  cooldownDays: 360
  trigger:
    all:
      - afterDay: 180
      - chance: 8
  effects:
    - modify: { target: link.grain_orrin_aldoria.capacity, pct: -5000, days: 90 }

- id: orrin_bumper_harvest
  tag: orrin
  severity: info
  headline: Bumper harvest in Orrin
  detail: Grain is 15% cheaper for two months.
  cooldownDays: 300
  trigger:
    chance: 20
  effects:
    - modify: { target: resource.grain.price, pct: -1500, days: 60 }

# --- Home --------------------------------------------------------------------

- id: workers_strike_threat
  tag: home
  severity: warning
  headline: Unions threaten a general strike over living costs
  detail: Stability falls while the threat hangs over the country.
  cooldownDays: 60
  trigger:
    all:
      - stat: { target: faction.aldoria_workers.satisfaction, below: 42 }
      - chance: 400
  effects:
    - modify: { target: country.aldoria.stability, add: -5, days: 45 }

- id: industry_layoffs
  tag: home
  severity: warning
  headline: Factories cut shifts as costs bite
  detail: Workers lose income and the treasury loses tax revenue.
  cooldownDays: 90
  trigger:
    all:
      - stat: { target: faction.aldoria_industry.satisfaction, below: 40 }
      - chance: 300
  effects:
    - modify: { target: faction.aldoria_workers.satisfaction, add: -6, days: 60 }
    - modify: { target: country.aldoria.revenue, add: -2000, days: 90 }

- id: military_doubts
  tag: home
  severity: warning
  headline: Senior officers voice doubts about the government
  detail: The military's loyalty wavers.
  cooldownDays: 120
  trigger:
    all:
      - stat: { target: country.aldoria.stability, below: 35 }
      - chance: 200
  effects:
    - modify: { target: faction.aldoria_military.satisfaction, add: -8, days: 90 }
