# Trade routes. capacity is units per day. Each resource starts with supply
# equal to demand, so prices only move when something happens.
# Routes through the South Strait carry nothing while it is closed.

# Oil: 80 units of demand, all supplied by Veskar.
- id: oil_veskar_aldoria
  resource: oil
  from: veskar
  to: aldoria
  capacity: 40
  via: [south_strait]

- id: oil_veskar_orrin
  resource: oil
  from: veskar
  to: orrin
  capacity: 5
  via: [south_strait]

- id: oil_veskar_thessa
  resource: oil
  from: veskar
  to: thessa
  capacity: 30

- id: oil_veskar_corvan
  resource: oil
  from: veskar
  to: corvan
  capacity: 5

