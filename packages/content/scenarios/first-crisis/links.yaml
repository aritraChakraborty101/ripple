# Trade routes. capacity is units per day. Each resource starts with supply
# equal to demand, so prices only move when something happens.
# Routes through the South Strait carry nothing while it is closed.

# Crude: 100 a day to the refineries. 55 of it passes the South Strait: all
# of Aldoria's and Velmont's sea crude and Thessa's from Veskar. Corvan's comes
# straight across from Veskar, so closing the strait spares Corvan's refinery.
- id: crude_veskar_aldoria
  resource: crude
  from: veskar
  to: aldoria
  capacity: 15
  via: [south_strait]
  days: 8

- id: crude_veskar_thessa
  resource: crude
  from: veskar
  to: thessa
  capacity: 33
  via: [south_strait]
  days: 9

- id: crude_veskar_velmont
  resource: crude
  from: veskar
  to: velmont
  capacity: 7
  via: [south_strait]
  days: 12

- id: crude_veskar_corvan
  resource: crude
  from: veskar
  to: corvan
  capacity: 15
  days: 3

# Planned overland pipeline that avoids the strait. It carries nothing until
# the player funds it (decision: overland_pipeline).
- id: crude_veskar_aldoria_overland
  resource: crude
  from: veskar
  to: aldoria
  capacity: 0
  days: 5

# The long way round (decision: long_way_round): Veskar's crude to Aldoria
# around the south, avoiding the strait. Ten more days at sea. It carries
# nothing until the player orders it, and the strait route carries nothing
# while it does.
- id: crude_veskar_aldoria_long
  resource: crude
  from: veskar
  to: aldoria
  capacity: 0
  days: 18

# Fuel: 100 a day of use. Aldoria refines 15 and buys 25: 15 from Thessa,
# 10 from Corvan. Veskar's small refinery serves Orrin and Ilmar by sea.
- id: fuel_thessa_aldoria
  resource: fuel
  from: thessa
  to: aldoria
  capacity: 15
  days: 3

- id: fuel_corvan_aldoria
  resource: fuel
  from: corvan
  to: aldoria
  capacity: 10
  days: 2

- id: fuel_veskar_orrin
  resource: fuel
  from: veskar
  to: orrin
  capacity: 5
  via: [south_strait]
  days: 7

- id: fuel_veskar_ilmar
  resource: fuel
  from: veskar
  to: ilmar
  capacity: 5
  via: [south_strait, narrows]
  days: 10

# Grain: 45 units of demand, all supplied by Orrin.
- id: grain_orrin_aldoria
  resource: grain
  from: orrin
  to: aldoria
  capacity: 20

- id: grain_orrin_veskar
  resource: grain
  from: orrin
  to: veskar
  capacity: 10
  via: [south_strait]

- id: grain_orrin_corvan
  resource: grain
  from: orrin
  to: corvan
  capacity: 5

# Steel: 35 units of demand: 30 from Thessa, 5 from Velmont.
- id: steel_thessa_aldoria
  resource: steel
  from: thessa
  to: aldoria
  capacity: 25

- id: steel_thessa_veskar
  resource: steel
  from: thessa
  to: veskar
  capacity: 5

# Kesh's crude goes overland to Thessa and Velmont: it never sees the strait.
- id: crude_kesh_velmont
  resource: crude
  from: kesh
  to: velmont
  capacity: 8
  days: 6

- id: crude_kesh_thessa
  resource: crude
  from: kesh
  to: thessa
  capacity: 12
  days: 5

- id: grain_orrin_ilmar
  resource: grain
  from: orrin
  to: ilmar
  capacity: 5
  via: [narrows]

- id: grain_orrin_kesh
  resource: grain
  from: orrin
  to: kesh
  capacity: 5

- id: steel_velmont_kesh
  resource: steel
  from: velmont
  to: kesh
  capacity: 5

# Chips: 28 units of demand, all made in Ilmar. Only Thessa's arrive without
# passing the Narrows.
- id: chips_ilmar_aldoria
  resource: chips
  from: ilmar
  to: aldoria
  capacity: 10
  via: [narrows]

- id: chips_ilmar_thessa
  resource: chips
  from: ilmar
  to: thessa
  capacity: 8

- id: chips_ilmar_velmont
  resource: chips
  from: ilmar
  to: velmont
  capacity: 8
  via: [narrows]

- id: chips_ilmar_kesh
  resource: chips
  from: ilmar
  to: kesh
  capacity: 2
  via: [narrows]

# Routes a trade deal opens (decision: trade_deal). Each carries nothing until
# Aldoria signs a deal with that country, and stops when the deal ends or
# either side imposes sanctions. Named deal_<country> so one template finds them.
- id: deal_veskar
  resource: crude
  from: veskar
  to: aldoria
  capacity: 0
  via: [south_strait]
  days: 8

- id: deal_orrin
  resource: grain
  from: orrin
  to: aldoria
  capacity: 0

- id: deal_thessa
  resource: steel
  from: thessa
  to: aldoria
  capacity: 0

# Kesh's deal route runs overland: crude that avoids the strait, from a
# supplier that may not last. Extra crude fills Aldoria's tanks as a buffer.
- id: deal_kesh
  resource: crude
  from: kesh
  to: aldoria
  capacity: 0
  days: 6

- id: deal_ilmar
  resource: chips
  from: ilmar
  to: aldoria
  capacity: 0
  via: [narrows]

- id: deal_velmont
  resource: steel
  from: velmont
  to: aldoria
  capacity: 0
